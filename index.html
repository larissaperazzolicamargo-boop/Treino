<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,600&family=Nunito:wght@400;500;600;700&display=swap');

:root{
  --concrete:#FFF7FA;
  --paper:#FFFFFF;
  --pine:#4A2B3E;
  --soft:#9C8091;
  --beet:#D6558C;
  --lilac:#A87BD4;
  --brass:#C08A6B;
  --line:#F4DCE7;
  --ok:#7DAF97;
  --blush:#FFF1F6;
  --shadow:0 2px 12px rgba(214,85,140,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
#app{
  font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:linear-gradient(175deg,#FFF7FA 0%,#FDF3F9 55%,#F9F1FB 100%);
  background-attachment:fixed;
  color:var(--pine);
  font-size:15px;
  line-height:1.45;
  min-height:100vh;
  padding-bottom:48px;
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---- sticky top ---- */
.top{position:sticky;top:0;z-index:20;
  background:rgba(255,247,250,.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line)}
.dayscroll{display:flex;gap:7px;overflow-x:auto;padding:11px 14px 9px;scrollbar-width:none}
.dayscroll::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--paper);
  color:var(--soft);font:inherit;font-size:13px;font-weight:700;
  padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;
  transition:transform .12s ease}
.chip:active{transform:scale(.96)}
.chip[data-on="1"]{background:linear-gradient(135deg,var(--beet),var(--lilac));
  color:#fff;border-color:transparent;box-shadow:0 2px 8px rgba(214,85,140,.25)}
.chip[data-today="1"]:after{content:"✿";margin-left:6px;font-size:10px;opacity:.75}

.nav{display:flex;gap:4px;padding:0 10px 9px}
.nav button{flex:1;background:transparent;border:0;
  font:inherit;font-size:12.5px;font-weight:700;
  color:var(--soft);padding:8px 0;cursor:pointer;border-radius:999px}
.nav button[data-on="1"]{background:var(--blush);color:var(--beet)}

/* ---- timer ---- */
.timer{position:sticky;top:0;z-index:19;
  background:linear-gradient(120deg,#5C3350,#8A4C7B 55%,#A87BD4);
  color:#fff;display:flex;align-items:center;gap:11px;padding:11px 15px;
  font-size:12.5px;font-weight:600;line-height:1.25}
.timer b{font-family:'Fraunces',serif;font-weight:600;font-size:25px;letter-spacing:-.01em}
.timer .bar{flex:1;height:4px;background:rgba(255,255,255,.25);border-radius:999px;position:relative}
.timer .bar i{position:absolute;inset:0 auto 0 0;border-radius:999px;
  background:linear-gradient(90deg,#FFD9E8,#fff)}
.timer button{background:rgba(255,255,255,.16);border:0;
  color:#fff;font:inherit;font-size:11.5px;font-weight:700;
  padding:6px 11px;border-radius:999px;cursor:pointer}

/* ---- head ---- */
.head{padding:22px 16px 16px}
.head .date{font-size:12.5px;font-weight:700;color:var(--beet);letter-spacing:.03em}
.head h1{font-family:'Fraunces',Georgia,serif;font-weight:600;
  font-size:33px;line-height:1.05;margin:7px 0 4px;letter-spacing:-.015em}
.head p{margin:0;color:var(--soft);font-size:14.5px;font-style:italic;
  font-family:'Fraunces',serif}

/* ---- exercise ---- */
.ex{background:var(--paper);border:1px solid var(--line);border-radius:18px;
  margin:0 14px 11px;overflow:hidden;box-shadow:var(--shadow)}
.ex.done{border-color:#BCDBCB;background:linear-gradient(180deg,#FBFFFC,#fff)}
.exhead{display:flex;gap:11px;padding:14px 15px;cursor:pointer;align-items:flex-start}
.idx{font-family:'Fraunces',serif;font-weight:600;font-size:15px;color:#EBC9DA;
  min-width:20px;padding-top:1px}
.ex.done .idx{color:var(--ok)}
.exname{flex:1;min-width:0}
.exname h3{margin:0;font-size:15.5px;font-weight:700;line-height:1.25}
.exmeta{font-size:12.5px;color:var(--beet);font-weight:700;margin-top:3px}
.last{font-size:12.5px;color:var(--soft);margin-top:3px;font-weight:500}
.last b{color:var(--pine);font-weight:700}
.caret{color:#E4C3D5;font-size:11px;padding-top:4px}

.sets{border-top:1px solid var(--line);padding:6px 15px 14px;display:none}
.ex.open .sets{display:block}
.setrow{display:flex;align-items:center;gap:8px;padding:6px 0}
.setno{font-size:11.5px;color:var(--soft);font-weight:700;width:34px}
.field{position:relative;flex:1}
.field input{width:100%;font:inherit;font-size:16px;font-weight:700;
  font-variant-numeric:tabular-nums;
  padding:10px 32px 10px 12px;border:1px solid var(--line);border-radius:12px;
  background:var(--blush);color:var(--pine);-moz-appearance:textfield}
.field input::placeholder{color:#E0BFD1}
.field input::-webkit-outer-spin-button,.field input::-webkit-inner-spin-button{
  -webkit-appearance:none;margin:0}
.field input:focus{outline:none;border-color:var(--beet);background:#fff;
  box-shadow:0 0 0 3px rgba(214,85,140,.12)}
.field span{position:absolute;right:11px;top:50%;transform:translateY(-50%);
  font-size:11px;color:var(--soft);pointer-events:none;font-weight:700}
.tick{flex:0 0 auto;width:38px;height:38px;border:1px solid var(--line);border-radius:999px;
  background:var(--blush);color:#E4C3D5;font-size:15px;cursor:pointer;line-height:1;
  transition:transform .12s ease}
.tick:active{transform:scale(.9)}
.tick[data-on="1"]{background:linear-gradient(135deg,var(--beet),var(--lilac));
  border-color:transparent;color:#fff;box-shadow:0 2px 8px rgba(214,85,140,.28)}
.pr{font-size:12.5px;color:var(--beet);font-weight:700;padding:6px 0 0 34px}
.note{font-size:12.5px;color:var(--soft);background:var(--blush);border-radius:12px;
  margin-top:10px;padding:10px 12px;line-height:1.5;font-weight:500}

/* ---- generic ---- */
.sec{padding:18px 16px 8px}
.sec h2{font-family:'Fraunces',serif;font-size:17px;font-weight:600;
  color:var(--pine);margin:0 0 11px;letter-spacing:-.01em}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;
  margin:0 14px 11px;padding:15px;box-shadow:var(--shadow)}
.big{font-family:'Fraunces',serif;font-weight:600;font-size:30px;letter-spacing:-.02em;
  color:var(--beet)}
.big span{color:var(--pine)}
.sub{font-size:12.5px;color:var(--soft);font-weight:500}
select,.btn{font:inherit;font-size:14.5px;font-weight:700;border:1px solid var(--line);
  background:var(--blush);color:var(--pine);padding:11px 12px;border-radius:12px;width:100%;
  cursor:pointer}
.btn{background:linear-gradient(135deg,var(--beet),var(--lilac));color:#fff;
  border-color:transparent;text-align:center;
  box-shadow:0 3px 10px rgba(214,85,140,.25)}
.btn:active{transform:scale(.985)}
.btn.ghost{background:transparent;color:var(--soft);border:1px solid var(--line);
  box-shadow:none;font-weight:600}
.seg{display:flex;gap:5px;margin:0 14px 11px;flex-wrap:wrap}
.seg button{flex:1;min-width:52px;font:inherit;font-size:12.5px;font-weight:700;padding:8px 2px;
  border:1px solid var(--line);background:var(--paper);color:var(--soft);cursor:pointer;
  border-radius:999px}
.seg button[data-on="1"]{background:linear-gradient(135deg,var(--beet),var(--lilac));
  color:#fff;border-color:transparent}
.empty{margin:0 14px;padding:28px 18px;border:1px dashed #EDC9DC;border-radius:18px;
  color:var(--soft);font-size:13.5px;text-align:center;line-height:1.55;
  background:rgba(255,255,255,.55);font-weight:500}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{text-align:left;padding:8px 4px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{font-size:11.5px;color:var(--soft);font-weight:700}
td{font-weight:600}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.grid2{display:flex;gap:8px;margin-bottom:8px}
.grid2 .field{flex:1}
.lbl{font-size:11.5px;color:var(--soft);font-weight:700;display:block;margin-bottom:5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app"><div class="empty" style="margin-top:40px">Carregando seus treinos ✿</div></div>

<script>
const PLAN = [
  {id:'infA', short:'Inferior A', title:'Inferior A', sub:'posterior, glúteo e quadríceps', wd:1, ex:[
    {id:'stiff', n:'Stiff com barra', s:4, r:'6-8', rest:90, note:'Abre o dia com ele, descansada. Excêntrica de 3 segundos, desce até sentir o alongamento, sem soltar a lombar. Carga alta aqui é o que muda a perna.'},
    {id:'hackA', n:'Hack machine ou agachamento', s:4, r:'8-10', rest:90, note:'O quadríceps deste dia. Enquanto descansa dele, faça a série da abdutora: o tempo passa e a coxa recupera igual.'},
    {id:'pelvica', n:'Elevação pélvica com barra', s:3, r:'8-10', rest:75, note:'Queixo no peito, empurra com o calcanhar, aperta o glúteo no topo.'},
    {id:'flexdeit', n:'Mesa flexora deitada', s:3, r:'10-12', rest:60, note:'Pausa de 1s na contração, descida controlada.'},
    {id:'bulgaro', n:'Búlgaro, tronco inclinado', s:3, r:'8-10 cada', rest:60, note:'Passada longa e tronco à frente: quanto mais inclinada, mais glúteo. Segure halteres pesados.'},
    {id:'abdA', n:'Cadeira abdutora, tronco à frente', s:4, r:'15-20', rest:45, note:'Único dia de abdutora na semana, por isso uma série a mais. Inclinar o tronco para frente joga o estímulo para o glúteo médio.'},
  ]},
  {id:'supA', short:'Superior A', title:'Superior A', sub:'ombro e tríceps', wd:2, ex:[
    {id:'desenv', n:'Desenvolvimento com halteres', s:4, r:'6-8', rest:90, note:'Principal do dia. Não travar o cotovelo em cima, mantém tensão.'},
    {id:'supinc', n:'Supino inclinado', s:3, r:'8-10', rest:75, note:'Estabilidade do ombro e um pouco de tronco. Pode pesar sem medo.'},
    {id:'elevlat', n:'Elevação lateral', s:4, r:'10-12', rest:45, note:'Sobe até a linha do ombro, desce lento. Peso demais joga o trabalho pro trapézio.'},
    {id:'elevinc', n:'Elevação lateral inclinada', s:3, r:'12-15', rest:45, note:'Deitada de lado no banco. Pega a parte mais difícil do movimento.'},
    {id:'tricorda', n:'Tríceps corda', s:3, r:'12-15', rest:45, note:'Abre a corda no final. Alterne com o face pull para não parar.'},
    {id:'trifran', n:'Tríceps francês', s:3, r:'10-12', rest:45, note:'Braço acima da cabeça alonga mais a cabeça longa do tríceps.'},
    {id:'facepull', n:'Face pull', s:3, r:'15-20', rest:45, note:'Puxa na altura do rosto. Postura e ombro posterior.'},
  ]},
  {id:'infB', short:'Inferior B', title:'Inferior B', sub:'quadríceps, glúteo e posterior', wd:4, ex:[
    {id:'agacho', n:'Agachamento livre', s:4, r:'6-8', rest:90, note:'Abre o dia com ele. Desce o máximo que a mobilidade permitir sem soltar a lombar. Se 90 segundos não bastarem para manter a carga, use 2 minutos só neste.'},
    {id:'terrasumo', n:'Levantamento terra sumô', s:4, r:'6-8', rest:90, note:'Pés largos e pontas abertas, empurra o chão com o meio do pé. É o movimento mais pesado que existe para glúteo e adutor.'},
    {id:'legpress', n:'Leg press, pés baixos', s:3, r:'8-10', rest:75, note:'Pés na parte de baixo do apoio deixa o quadríceps como protagonista.'},
    {id:'flexsentB', n:'Flexora sentada', s:3, r:'10-12', rest:60, note:'Sentada alonga mais o posterior que a deitada, e alongamento é onde ele mais cresce.'},
    {id:'pelvuni', n:'Elevação pélvica unilateral', s:3, r:'10-12 cada', rest:60, note:'Segunda dose de glúteo da semana. Pausa de 2s no topo.'},
    {id:'extensora', n:'Cadeira extensora', s:3, r:'12-15', rest:45, note:'Pausa de 1s no topo, sem chutar o peso. Alterne com a adutora.'},
    {id:'adutoraB', n:'Cadeira adutora', s:3, r:'12-15', rest:45, note:'A parte interna da coxa é o que a abdutora não pega. Com ela, a perna fecha o formato de todos os lados.'},
  ]},
  {id:'supB', short:'Superior B', title:'Superior B', sub:'costas e bíceps', wd:5, ex:[
    {id:'puxada', n:'Puxada frente aberta', s:4, r:'6-8', rest:90, note:'Principal do dia. Puxa com o cotovelo, peito para frente. Se chegar em 12 reps fácil, sobe a carga.'},
    {id:'remcurv', n:'Remada curvada ou serrote', s:4, r:'8-10', rest:90, note:'Tronco firme, sem embalo do quadril.'},
    {id:'rembaixa', n:'Remada baixa neutra', s:3, r:'10-12', rest:60, note:'Aperta as escápulas no final.'},
    {id:'pulldown', n:'Pulldown reto', s:3, r:'12-15', rest:45, note:'Braço esticado. Pega o dorsal em alongamento.'},
    {id:'crucinv', n:'Crucifixo inverso', s:2, r:'15', rest:45, note:'Ombro posterior, carga leve e amplitude completa.'},
    {id:'roscadir', n:'Rosca direta', s:3, r:'8-10', rest:60, note:'Cotovelo parado ao lado do corpo. Alterne com a martelo e os dois saem em metade do tempo.'},
    {id:'martelo', n:'Rosca martelo', s:3, r:'10-12', rest:45, note:'Pega o braquial, dá espessura ao braço.'},
    {id:'prancha', n:'Prancha', s:3, r:'45s', rest:45, note:'Quadril na linha do corpo. Anote os segundos no campo de reps.'},
  ]},
];
const EXMAP = {}; PLAN.forEach(d=>d.ex.forEach(e=>EXMAP[d.id+'/'+e.id]={...e,day:d}));
const RUN = [
  {id:'volta', n:'Volta à corrida', tag:'base aeróbica', when:'domingo',
   desc:'Alterna corrida e caminhada e vai aumentando o bloco corrido a cada semana. É assim que se volta a correr sem canelite nem dor no joelho.',
   wu:300, cd:180,
   prog:[
     {w:1, b:6, work:120, rest:120},
     {w:2, b:6, work:180, rest:120},
     {w:3, b:5, work:240, rest:120},
     {w:4, b:4, work:360, rest:120},
     {w:5, b:3, work:540, rest:120},
     {w:6, b:2, work:840, rest:120},
     {w:7, b:2, work:1080, rest:120},
     {w:8, b:1, work:1800, rest:0},
   ]},
  {id:'bike', n:'HIIT na bike ou elíptico', tag:'sem impacto', when:'terça ou sexta',
   desc:'O HIIT que menos atrapalha a perna, porque não tem impacto nem fase excêntrica. Use este nas semanas de treino pesado de inferior.',
   wu:300, cd:180, b:8, work:20, rest:40,
   note:'Nos 20 segundos, resistência alta e cadência máxima que você conseguir sustentar. Nos 40, pedala solto.'},
  {id:'esteira', n:'HIIT na esteira inclinada', tag:'impacto baixo', when:'terça ou sexta',
   desc:'Inclinação de 6 a 10% em ritmo forte, depois caminhada na mesma inclinação. Puxa glúteo e posterior sem a pancada da corrida no plano.',
   wu:300, cd:180, b:10, work:60, rest:60,
   note:'Se não der para sustentar o minuto inteiro, reduza a velocidade antes de reduzir a inclinação.'},
  {id:'tiros', n:'Tiros na rua ou pista', tag:'impacto alto', when:'domingo',
   desc:'Só depois de 3 ou 4 semanas de base com o protocolo de volta à corrida. Ritmo forte, mas não sprint.',
   wu:300, cd:300, b:6, work:120, rest:90,
   note:'O tiro é forte e sustentável até o fim. Se o último bloco desabar, você começou rápido demais.'},
  {id:'subida', n:'Sprint curto em subida', tag:'impacto alto', when:'sexta',
   desc:'Oito tiros de 15 segundos numa ladeira, voltando caminhando. Volume baixíssimo, estímulo alto para glúteo e posterior.',
   wu:300, cd:180, b:8, work:15, rest:90,
   note:'Nunca faça no dia anterior a um treino de inferior. Sprint castiga o posterior e você chega sem perna.'},
  {id:'caminhada', n:'Caminhada longa', tag:'não atrapalha nada', when:'qualquer dia',
   desc:'Quarenta e cinco minutos em ritmo de conversa, na rua ou na esteira sem inclinação. Parece simples demais para funcionar, mas é a ferramenta mais eficiente que existe para gastar gordura sem roubar recuperação do treino de perna.',
   wu:0, cd:0, b:1, work:2700, rest:0, label:'caminhando',
   note:'Pode ser todos os dias, inclusive nos de perna e no domingo. Se preferir, divida em duas de 20 minutos ao longo do dia.'},
];
const RUNMAP={}; RUN.forEach(r=>RUNMAP[r.id]=r);
const MEDIDAS = [
  {k:'peso', n:'Peso', u:'kg'},
  {k:'coxaD', n:'Coxa direita', u:'cm'},
  {k:'coxaE', n:'Coxa esquerda', u:'cm'},
  {k:'gluteo', n:'Glúteo', u:'cm'},
  {k:'cintura', n:'Cintura', u:'cm'},
];

let S = {tab:'treino', day:null, sessions:[], medidas:[], corridas:[], open:{},
  chartEx:'infA/stiff', chartMed:'coxaD', runOpen:null, runWeek:1, dataPanel:null, impPanel:false, ready:false, err:null};
let timer = {on:false, left:0, total:0, h:null, seq:null, i:0, label:''};

const K_S='treino:sessions', K_M='treino:medidas', K_R='treino:corridas';

/* Guarda no Claude quando aberto aqui; usa o armazenamento do navegador
   quando o arquivo é aberto direto pelo celular. */
const DB = (()=>{
  const inClaude = typeof window!=='undefined' && window.storage && window.storage.get;
  if(inClaude) return {
    get: async k=>{ try{ const r=await window.storage.get(k); return r? r.value : null; }catch(e){ return null; } },
    set: (k,v)=>window.storage.set(k,v),
    del: k=>window.storage.delete(k)
  };
  return {
    get: async k=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } },
    set: async (k,v)=>{ localStorage.setItem(k,v); },
    del: async k=>{ localStorage.removeItem(k); }
  };
})();
const todayISO = ()=>new Date().toISOString().slice(0,10);
const fmtDate = iso=>{
  const [y,m,d]=iso.split('-');
  return d+'/'+m;
};
const WD=['dom','seg','ter','qua','qui','sex','sáb'];

async function load(){
  const j = async (k,d)=>{ try{ const v=await DB.get(k); return v? JSON.parse(v):d; }catch(e){ return d; } };
  S.sessions = await j(K_S,[]);
  S.medidas  = await j(K_M,[]);
  S.corridas = await j(K_R,[]);
  const wd = new Date().getDay();
  S.day = (PLAN.find(d=>d.wd===wd) || PLAN[0]).id;
  const done = S.corridas.filter(c=>c.proto==='volta').length;
  S.runWeek = Math.min(8, done+1);
  S.ready=true; render();
}
let saveT=null;
function save(){
  clearTimeout(saveT);
  saveT=setTimeout(async()=>{
    try{
      await DB.set(K_S, JSON.stringify(S.sessions));
      await DB.set(K_M, JSON.stringify(S.medidas));
      await DB.set(K_R, JSON.stringify(S.corridas));
    }catch(e){ S.err='Não consegui salvar. Tente de novo em instantes.'; render(); }
  },350);
}

function session(dayId, date){
  let s = S.sessions.find(x=>x.day===dayId && x.date===date);
  if(!s){ s={day:dayId, date, sets:{}}; S.sessions.push(s); }
  return s;
}
function findSession(dayId,date){ return S.sessions.find(x=>x.day===dayId&&x.date===date); }
function setVal(dayId,date,exId,i,field,v){
  const s=session(dayId,date);
  s.sets[exId] = s.sets[exId]||[];
  s.sets[exId][i] = s.sets[exId][i]||{};
  s.sets[exId][i][field]= v===''? null : v;
  save();
}
function best(sets){ // {kg,reps} with max kg
  if(!sets) return null;
  let b=null;
  sets.forEach(x=>{ if(x&&x.kg!=null&&x.reps!=null&&(!b||x.kg>b.kg)) b=x; });
  return b;
}
function prevBest(dayId,exId,beforeDate){
  const hist = S.sessions
    .filter(s=>s.day===dayId && s.date<beforeDate && s.sets[exId])
    .sort((a,b)=>b.date.localeCompare(a.date));
  for(const s of hist){ const b=best(s.sets[exId]); if(b) return {...b,date:s.date}; }
  return null;
}
function volume(sets){
  if(!sets) return 0;
  return sets.reduce((t,x)=>t+((x&&x.kg&&x.reps)?x.kg*x.reps:0),0);
}

/* ---------- timer ---------- */
function startTimer(sec){ startSeq([{l:'descanso',s:sec}]); }
function startSeq(phases){
  if(!phases.length) return;
  timer.seq=phases; timer.i=0; timer.on=true; beginPhase();
}
function beginPhase(){
  const p=timer.seq[timer.i];
  timer.label=p.l; timer.total=p.s; timer.left=p.s;
  clearInterval(timer.h);
  timer.h=setInterval(tick,1000);
  paintTimer();
}
function tick(){
  timer.left--;
  if(timer.left<=0){
    const last = timer.i+1>=timer.seq.length;
    if(navigator.vibrate) navigator.vibrate(last?[160,90,160,90,160]:[160]);
    timer.i++;
    if(!last){ beginPhase(); return; }
    clearInterval(timer.h); timer.on=false;
  }
  paintTimer();
}
function nextPhase(){
  clearInterval(timer.h);
  timer.i++;
  if(timer.i<timer.seq.length){ beginPhase(); }
  else { timer.on=false; paintTimer(); }
}
function stopTimer(){ clearInterval(timer.h); timer.on=false; paintTimer(); }
function paintTimer(){
  const el=document.getElementById('timerslot');
  if(!el) return;
  if(!timer.on){ el.innerHTML=''; return; }
  const m=Math.floor(timer.left/60), s=timer.left%60;
  const pct=(timer.left/timer.total*100).toFixed(1);
  const multi=timer.seq.length>1;
  const blocks=timer.seq.filter(p=>p.k).length;
  const doneB=timer.seq.slice(0,timer.i+1).filter(p=>p.k).length;
  el.innerHTML = `<div class="timer">
    <b class="num">${m}:${String(s).padStart(2,'0')}</b>
    <span style="min-width:74px">${timer.label}${multi&&blocks?`<br><span style="opacity:.6">bloco ${Math.max(1,doneB)}/${blocks}</span>`:''}</span>
    <span class="bar"><i style="width:${pct}%"></i></span>
    <button onclick="${multi?'nextPhase':'stopTimer'}()">${multi?'pular':'parar'}</button>
    ${multi?'<button onclick="stopTimer()">encerrar</button>':''}</div>`;
}
function buildSeq(p, step){
  const seq=[];
  if(p.wu) seq.push({l:'aquecimento',s:p.wu});
  const b = step? step.b : p.b, work = step? step.work : p.work, rest = step? step.rest : p.rest;
  for(let i=0;i<b;i++){
    seq.push({l:p.label||'FORTE',s:work,k:1});
    if(rest && i<b-1) seq.push({l:'leve',s:rest});
  }
  if(p.cd) seq.push({l:'volta à calma',s:p.cd});
  return seq;
}
function mmss(s){ const m=Math.floor(s/60); return s%60? (m?m+' min '+(s%60)+'s':s+'s') : m+' min'; }

/* ---------- render ---------- */
function render(){
  const app=document.getElementById('app');
  if(!S.ready){ return; }
  let body='';
  if(S.tab==='treino') body=viewTreino();
  else if(S.tab==='corrida') body=viewCorrida();
  else if(S.tab==='evolucao') body=viewEvol();
  else body=viewMedidas();

  app.innerHTML = `
  <div class="top">
    ${S.tab==='treino'? dayChips():''}
    <div class="nav">
      ${[['treino','Treino'],['corrida','Corrida'],['evolucao','Evolução'],['medidas','Medidas']].map(([k,l])=>
        `<button data-on="${S.tab===k?1:0}" onclick="go('${k}')">${l}</button>`).join('')}
    </div>
  </div>
  <div id="timerslot"></div>
  ${S.err?`<div class="card" style="border-color:var(--beet);color:var(--beet)">${S.err}</div>`:''}
  ${body}`;
  paintTimer();
}
function go(t){ S.tab=t; S.err=null; render(); }
function dayChips(){
  const wd=new Date().getDay();
  return `<div class="dayscroll">${PLAN.map(d=>
    `<button class="chip" data-on="${S.day===d.id?1:0}" data-today="${d.wd===wd?1:0}"
      onclick="pick('${d.id}')">${d.short}</button>`).join('')}</div>`;
}
function pick(id){ S.day=id; render(); }
function toggle(key){ S.open[key]=!S.open[key]; render(); }

function viewTreino(){
  const day = PLAN.find(d=>d.id===S.day);
  const date = todayISO();
  const now = new Date();
  const s = findSession(day.id,date);
  let out = `<div class="head">
    <div class="date">${WD[now.getDay()]} ${now.getDate()} · ${['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][now.getMonth()]}</div>
    <h1>${day.title}</h1><p>${day.sub}</p></div>`;

  day.ex.forEach((e,i)=>{
    const key=day.id+'/'+e.id;
    const mine = s && s.sets[e.id] ? s.sets[e.id] : [];
    const filled = mine.filter(x=>x&&x.kg!=null&&x.reps!=null).length;
    const done = filled>=e.s;
    const pb = prevBest(day.id,e.id,date);
    const tb = best(mine);
    const beat = pb && tb && (tb.kg>pb.kg || (tb.kg===pb.kg && tb.reps>pb.reps));
    let rows='';
    for(let k=0;k<e.s;k++){
      const v = mine[k]||{};
      rows+=`<div class="setrow">
        <span class="setno">série ${k+1}</span>
        <label class="field"><input inputmode="decimal" placeholder="—" value="${v.kg??''}"
          oninput="setVal('${day.id}','${date}','${e.id}',${k},'kg',this.value===''?'':parseFloat(this.value))"><span>kg</span></label>
        <label class="field"><input inputmode="numeric" placeholder="—" value="${v.reps??''}"
          oninput="setVal('${day.id}','${date}','${e.id}',${k},'reps',this.value===''?'':parseInt(this.value))"><span>reps</span></label>
        <button class="tick" data-on="${v.kg!=null&&v.reps!=null?1:0}"
          onclick="startTimer(${e.rest})" aria-label="descansar">✓</button>
      </div>`;
    }
    out+=`<div class="ex ${done?'done':''} ${S.open[key]?'open':''}">
      <div class="exhead" onclick="toggle('${key}')">
        <span class="idx num">${String(i+1).padStart(2,'0')}</span>
        <span class="exname">
          <h3>${e.n}</h3>
          <div class="exmeta num">${e.s} × ${e.r} · descanso ${e.rest>=60?(e.rest/60)+' min':e.rest+'s'}</div>
          ${pb?`<div class="last">última vez <b class="num">${pb.kg} kg × ${pb.reps}</b> em ${fmtDate(pb.date)}</div>`
              :`<div class="last">primeira vez neste exercício</div>`}
          ${filled?`<div class="last">hoje <b class="num">${filled}/${e.s} séries</b>${beat?' · superou':''}</div>`:''}
        </span>
        <span class="caret">${S.open[key]?'⌃':'⌄'}</span>
      </div>
      <div class="sets">
        ${rows}
        ${beat?`<div class="pr">✦ Você bateu a carga anterior</div>`:''}
        <div class="note">${e.note}</div>
      </div></div>`;
  });

  const vol = s? day.ex.reduce((t,e)=>t+volume(s.sets[e.id]),0):0;
  out+=`<div class="card"><div class="sub">Volume de hoje</div>
    <div class="big num">${Math.round(vol).toLocaleString('pt-BR')} <span style="font-size:14px;font-family:Archivo">kg levantados</span></div>
    <div class="sub" style="margin-top:6px">Soma de carga × repetições de todas as séries anotadas.</div></div>`;
  out+=`<div class="sec"><h2>Meus dados</h2></div>`;
  if(S.dataPanel!=null){
    out+=`<div class="card">
      <span class="lbl">Seu backup. Toque e segure para selecionar tudo, depois copie.</span>
      <textarea readonly onclick="this.select()" style="width:100%;height:110px;font:inherit;
        font-size:11px;border:1px solid var(--line);border-radius:12px;padding:10px;
        background:var(--blush);color:var(--pine)">${S.dataPanel}</textarea>
      <button class="btn ghost" style="margin-top:8px" onclick="S.dataPanel=null;render()">Fechar</button>
    </div>`;
  }
  if(S.impPanel){
    out+=`<div class="card">
      <span class="lbl">Cole aqui o backup que você copiou</span>
      <textarea id="impbox" placeholder="{...}" style="width:100%;height:110px;font:inherit;
        font-size:11px;border:1px solid var(--line);border-radius:12px;padding:10px;
        background:var(--blush);color:var(--pine)"></textarea>
      <button class="btn" style="margin-top:8px" onclick="importData()">Substituir meus dados</button>
      <button class="btn ghost" style="margin-top:6px" onclick="S.impPanel=false;render()">Cancelar</button>
    </div>`;
  }
  out+=`<div class="sec" style="padding-top:0">
    <button class="btn ghost" onclick="exportData()">Copiar meus dados</button>
    <button class="btn ghost" style="margin-top:7px" onclick="S.impPanel=true;render()">Colar dados de backup</button>
    <button class="btn ghost" style="margin-top:7px;color:var(--beet)" onclick="resetAll()">Apagar tudo</button>
  </div>`;
  return out;
}
function exportData(){
  S.dataPanel=JSON.stringify({v:1,sessions:S.sessions,medidas:S.medidas,corridas:S.corridas});
  S.impPanel=false; render();
}
function importData(){
  const el=document.getElementById('impbox');
  const t=el? el.value.trim():'';
  try{
    const o=JSON.parse(t);
    if(!o || (!o.sessions && !o.medidas && !o.corridas)) throw new Error('vazio');
    S.sessions=o.sessions||[]; S.medidas=o.medidas||[]; S.corridas=o.corridas||[];
    S.impPanel=false; S.dataPanel=null; S.err=null; save(); render();
  }catch(e){
    S.err='Esse texto não é um backup válido. Copie o bloco inteiro, incluindo as chaves do começo e do fim.';
    render();
  }
}

/* ---------- chart ---------- */
function lineChart(pts, unit){
  if(pts.length===0) return '<div class="empty">Sem registros ainda.</div>';
  const W=320,H=140,P=26;
  if(pts.length===1){
    return `<div class="big num">${pts[0].v} <span style="font-size:14px;font-family:Archivo">${unit}</span></div>
      <div class="sub">Um único registro em ${fmtDate(pts[0].d)}. O gráfico aparece a partir do segundo.</div>`;
  }
  const vs=pts.map(p=>p.v);
  let mn=Math.min(...vs), mx=Math.max(...vs);
  if(mn===mx){ mn=mn-1; mx=mx+1; }
  const pad=(mx-mn)*.15; mn-=pad; mx+=pad;
  const x=i=>P+i*(W-P*2)/(pts.length-1);
  const y=v=>H-20-((v-mn)/(mx-mn))*(H-46);
  const path=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
  const dots=pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3"
    fill="var(--paper)" stroke="var(--pine)" stroke-width="1.6"/>`).join('');
  const lastI=pts.length-1;
  const first=pts[0].v, last=pts[lastI].v;
  const diff=last-first;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;overflow:visible">
    <line x1="${P}" y1="${H-20}" x2="${W-P}" y2="${H-20}" stroke="var(--line)"/>
    <path d="${path}" fill="none" stroke="var(--pine)" stroke-width="2"/>
    ${dots}
    <circle cx="${x(lastI).toFixed(1)}" cy="${y(last).toFixed(1)}" r="4.5" fill="var(--beet)"/>
    <text x="${P}" y="${H-6}" font-size="9" fill="var(--soft)">${fmtDate(pts[0].d)}</text>
    <text x="${W-P}" y="${H-6}" font-size="9" fill="var(--soft)" text-anchor="end">${fmtDate(pts[lastI].d)}</text>
    <text x="${x(lastI).toFixed(1)}" y="${(y(last)-11).toFixed(1)}" font-size="11" font-weight="700"
      fill="var(--beet)" text-anchor="${lastI? 'end':'start'}">${last}</text>
  </svg>
  <div class="sub" style="margin-top:8px">
    ${diff>0?'Subiu':diff<0?'Caiu':'Estável em'} <b class="num" style="color:var(--pine)">${Math.abs(diff).toFixed(1).replace('.0','')} ${unit}</b>
    ao longo de ${pts.length} registros.</div>`;
}

function viewEvol(){
  const [dayId,exId]=S.chartEx.split('/');
  const e=EXMAP[S.chartEx];
  const hist=S.sessions.filter(s=>s.day===dayId&&s.sets[exId]&&best(s.sets[exId]))
    .sort((a,b)=>a.date.localeCompare(b.date));
  const pts=hist.map(s=>({d:s.date,v:best(s.sets[exId]).kg}));
  const sessCount=S.sessions.filter(s=>Object.keys(s.sets||{}).some(k=>best(s.sets[k]))).length;

  let opts='';
  PLAN.forEach(d=>{
    opts+=`<optgroup label="${d.short}">`;
    d.ex.forEach(x=>{ const k=d.id+'/'+x.id;
      opts+=`<option value="${k}" ${S.chartEx===k?'selected':''}>${x.n}</option>`; });
    opts+='</optgroup>';
  });

  let rows = hist.slice().reverse().slice(0,12).map(s=>{
    const b=best(s.sets[exId]);
    return `<tr><td>${fmtDate(s.date)}</td><td class="r num">${b.kg} kg</td>
      <td class="r num">${b.reps} reps</td><td class="r num">${Math.round(volume(s.sets[exId]))}</td></tr>`;
  }).join('');

  return `<div class="sec"><h2>Carga máxima por treino</h2></div>
  <div class="card"><select onchange="S.chartEx=this.value;render()">${opts}</select></div>
  <div class="card">${lineChart(pts,'kg')}</div>
  ${rows?`<div class="card"><table>
    <tr><th>Data</th><th class="r">Melhor série</th><th class="r"></th><th class="r">Volume</th></tr>
    ${rows}</table></div>`:''}
  <div class="card"><div class="sub">Treinos registrados</div>
    <div class="big num">${sessCount}</div></div>`;
}

function viewCorrida(){
  const wk = S.corridas.filter(c=>{
    const d=new Date(c.date), now=new Date();
    return (now-d)/86400000 < 7;
  }).length;

  let cards='';
  RUN.forEach(p=>{
    const open = S.runOpen===p.id;
    const isVolta = p.id==='volta';
    const step = isVolta? p.prog[S.runWeek-1] : null;
    const b = step? step.b : p.b, work = step? step.work : p.work, rest = step? step.rest : p.rest;
    const totalS = (p.wu||0)+(p.cd||0)+b*work+(b-1)*(rest||0);
    const feitas = S.corridas.filter(c=>c.proto===p.id).length;

    let weekPicker='';
    if(isVolta && open){
      weekPicker=`<div style="margin:8px 0 4px"><span class="lbl">Semana do programa</span>
        <div class="seg" style="margin:0">${p.prog.map(s=>
          `<button data-on="${S.runWeek===s.w?1:0}" onclick="event.stopPropagation();S.runWeek=${s.w};render()">${s.w}</button>`).join('')}</div></div>`;
    }

    cards += `<div class="ex ${open?'open':''}">
      <div class="exhead" onclick="S.runOpen='${open?'':p.id}';render()">
        <span class="exname">
          <h3>${p.n}</h3>
          <div class="exmeta">${p.tag} · sugerido ${p.when}</div>
          <div class="last num">${b} × ${mmss(work)} forte${rest?` / ${mmss(rest)} leve`:''} · ${Math.round(totalS/60)} min no total</div>
          ${feitas?`<div class="last">${feitas} ${feitas===1?'sessão feita':'sessões feitas'}</div>`:''}
        </span>
        <span class="caret">${open?'⌃':'⌄'}</span>
      </div>
      <div class="sets">
        ${weekPicker}
        <div class="note" style="border-top:0;margin-top:4px;padding-top:6px">${p.desc}${p.note?'<br><br>'+p.note:''}</div>
        <button class="btn" style="margin-top:10px"
          onclick='startSeq(buildSeq(${JSON.stringify(p)}, ${step?JSON.stringify(step):'null'}))'>Iniciar com cronômetro</button>
        <button class="btn ghost" style="margin-top:6px"
          onclick="logRun('${p.id}',${isVolta?S.runWeek:0})">Marcar como feita hoje</button>
      </div></div>`;
  });

  const hist = S.corridas.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10)
    .map(c=>`<tr><td>${fmtDate(c.date)}</td><td>${RUNMAP[c.proto]?RUNMAP[c.proto].n:c.proto}</td>
      <td class="r">${c.week?'sem '+c.week:'—'}</td></tr>`).join('');

  return `<div class="head">
      <div class="date">cardio</div>
      <h1>Corrida e tiros</h1>
      <p>Duas a três sessões por semana, sempre separadas do treino de perna.</p>
    </div>
    <div class="card">
      <div class="sub">Sessões nos últimos 7 dias</div>
      <div class="big num">${wk}</div>
      <div class="sub" style="margin-top:6px">O cronômetro apita e vibra a cada troca de bloco. Deixe a tela aberta durante a sessão.</div>
    </div>
    <div class="sec"><h2>Onde encaixar na semana</h2></div>
    <div class="card"><table>
      <tr><td>Todos os dias</td><td class="r">Caminhada longa, se der</td></tr>
      <tr><td>Terça e sexta</td><td class="r">HIIT sem impacto, depois do superior</td></tr>
      <tr><td>Sábado ou domingo</td><td class="r">Corrida contínua ou tiros</td></tr>
      <tr><td>Segunda e quinta</td><td class="r">Dias de perna, nada de tiros</td></tr>
    </table>
    <div class="sub" style="margin-top:9px">HIIT no mesmo dia de perna, ou na véspera, rouba a recuperação justamente do posterior e do glúteo, que são sua prioridade. Nos dias de superior isso não acontece. Caminhada pode todo dia: ela gasta gordura sem competir com o treino.</div>
    <div class="sub" style="margin-top:9px">Para perder gordura e ganhar músculo ao mesmo tempo, o cardio que mais rende é a caminhada, não mais HIIT. Duas sessões de HIIT por semana é o teto: acima disso você só tira energia das cargas pesadas.</div>
    </div>
    <div class="sec"><h2>Protocolos</h2></div>
    ${cards}
    ${hist?`<div class="sec"><h2>Últimas sessões</h2></div>
      <div class="card"><table>${hist}</table></div>`:
      `<div class="empty" style="margin-top:8px">Nenhuma sessão registrada ainda. Comece pela volta à corrida, semana 1.</div>`}`;
}
function logRun(proto,week){
  S.corridas.push({date:todayISO(), proto, week:week||null});
  if(proto==='volta') S.runWeek=Math.min(8,(week||1)+1);
  save(); render();
}

function viewMedidas(){
  const date=todayISO();
  let hoje = S.medidas.find(m=>m.date===date);
  const fields = MEDIDAS.map(m=>`
    <div style="margin-bottom:8px"><span class="lbl">${m.n}</span>
    <label class="field"><input inputmode="decimal" placeholder="—" value="${hoje&&hoje[m.k]!=null?hoje[m.k]:''}"
      oninput="setMed('${m.k}',this.value)"><span>${m.u}</span></label></div>`).join('');

  const pts=S.medidas.filter(m=>m[S.chartMed]!=null).sort((a,b)=>a.date.localeCompare(b.date))
    .map(m=>({d:m.date,v:m[S.chartMed]}));
  const unit=(MEDIDAS.find(m=>m.k===S.chartMed)||{}).u||'cm';

  return `<div class="sec"><h2>Medidas de hoje</h2></div>
  <div class="card">${fields}
    <div class="sub">Meça sempre no mesmo ponto e no mesmo horário, de preferência de manhã. A coxa costuma ser medida a 15 cm acima do joelho.</div>
  </div>
  <div class="sec"><h2>Evolução</h2></div>
  <div class="seg">${MEDIDAS.map(m=>
    `<button data-on="${S.chartMed===m.k?1:0}" onclick="S.chartMed='${m.k}';render()">${m.n.split(' ')[0]}${m.n.includes('direita')?' D':m.n.includes('esquerda')?' E':''}</button>`).join('')}</div>
  <div class="card">${lineChart(pts,unit)}</div>`;
}
function setMed(k,v){
  const date=todayISO();
  let m=S.medidas.find(x=>x.date===date);
  if(!m){ m={date}; S.medidas.push(m); }
  m[k]= v===''? null : parseFloat(v);
  save();
}
async function resetAll(){
  if(!confirm('Apagar todos os treinos e medidas registrados? Isso não pode ser desfeito.')) return;
  S.sessions=[]; S.medidas=[]; S.corridas=[];
  try{ await DB.del(K_S); await DB.del(K_M); await DB.del(K_R); }catch(e){}
  render();
}
load();
</script>
